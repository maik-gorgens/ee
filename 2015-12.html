<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Dezember 2015 – Blogarchiv</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; color: #252524; background: #f8f7f3; font-family: Georgia, 'Times New Roman', serif; line-height: 1.7; }
main { max-width: 860px; margin: 0 auto; padding: 12px 24px 75px; }
a { color: #275d70; }
a:hover { color: #123a48; }
h1, h2, h3, nav, .metadata, .footer, .count { font-family: system-ui, -apple-system, sans-serif; }
h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 22px 0 6px; line-height: 1.18; }
.subtitle { color: #777; margin: 0 0 24px; }
nav { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center;
      margin: 23px 0; padding: 14px 0; border-top: 1px solid #ccc; border-bottom: 1px solid #ccc; font-size: .93rem; }
nav .disabled { color: #aaa; }
.post { background: #fff; border: 1px solid #e7e4de; border-radius: 8px;
        margin: 25px 0; padding: 20px 26px 28px; overflow-wrap: anywhere; }
.post h2 { font-size: 1.42rem; margin: 4px 0 8px; line-height: 1.3; }
.metadata { font-size: .82rem; color: #777; }
.post-content { margin-top: 22px; }
.post-content img, .post-content video, .post-content iframe { max-width: 100%; height: auto; }
.post-content iframe { aspect-ratio: 16 / 9; width: 100%; min-height: 180px; }
.post-content img { object-fit: contain; }
.post-content table { display: block; overflow-x: auto; max-width: 100%; }
.post-content pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.post-content .separator { text-align: center; }
.comments { margin-top: 30px; border-top: 1px solid #ddd; padding-top: 13px; }
.comments h3 { font-size: 1.05rem; margin: 0 0 12px; }
.comment-list { display: grid; gap: 12px; }
.comment { border-left: 3px solid #c8d7d5; padding: 5px 0 5px 12px; background: #fafbf9; }
.comment .metadata { margin: 0 0 5px; }
.comment-body { overflow-wrap: anywhere; }
.comment-body p { margin: .4em 0; }
.comment-body img { max-width: 100%; height: auto; }
.comment-replies { padding-left: 15px; margin: 12px 0 3px; display: grid; gap: 12px; }
.warning { background: #fff7ea; border: 1px solid #e8d3a6; border-radius: 5px; padding: 12px 16px; }
.index-year { margin: 32px 0; }
.month-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; list-style: none; padding: 0; }
.month-list a { background: white; padding: 12px 15px; display: flex; justify-content: space-between;
                border: 1px solid #e7e4de; border-radius: 6px; text-decoration: none; }
.month-list a:hover { text-decoration: underline; }
.count { color: #888; font-size: .8rem; margin-left: 12px; }
.footer { text-align: center; font-size: .8rem; color: #777; margin-top: 45px; }
@media (max-width: 600px) { main { padding: 8px 14px 40px; } .post { padding: 16px; } nav { font-size: .85rem; } }
</style>
</head>
